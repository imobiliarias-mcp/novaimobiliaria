[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-research"
version = "0.1.0"
description = "Central rental research MCP module for Nova Imobiliária"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nova_research"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
